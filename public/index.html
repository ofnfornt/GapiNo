<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GapiNo — شبکه اجتماعی نسل جدید</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">G</span><span>GapiNo</span></div>
    <div class="search"><span>⌕</span><input id="search" placeholder="جستجو در GapiNo..." /></div>
    <nav><button class="icon-btn">⌂</button><button class="icon-btn">♡</button><button class="profile">A</button></nav>
  </header>

  <main class="layout">
    <aside class="sidebar glass">
      <button class="nav active">⌂ <span>خانه</span></button>
      <button class="nav">⌕ <span>اکتشاف</span></button>
      <button class="nav">♧ <span>دنبال‌شونده‌ها</span></button>
      <button class="nav">✉ <span>پیام‌ها</span></button>
      <button class="nav">♡ <span>اعلان‌ها</span></button>
      <button class="nav">＋ <span>ساخت پست</span></button>
      <div class="side-bottom"><button class="nav">⚙ <span>تنظیمات</span></button></div>
    </aside>

    <section class="feed">
      <div class="stories glass" id="stories"></div>
      <div id="feed"></div>
    </section>

    <aside class="rightbar">
      <div class="card glass welcome">
        <div class="gradient-orb"></div><div class="big-g">G</div>
        <h2>به GapiNo خوش آمدید</h2>
        <p>جایی برای ارتباط، کشف و اشتراک لحظه‌های خاص.</p>
        <button class="primary">شروع کنید</button>
      </div>
      <div class="card glass">
        <div class="card-title"><b>پیشنهاد برای دنبال کردن</b><a>همه</a></div>
        <div class="suggest"><span class="avatar pink">N</span><div><b>Nova</b><small>@nova</small></div><button>دنبال کردن</button></div>
        <div class="suggest"><span class="avatar blue">M</span><div><b>Mahdi</b><small>@mahdi</small></div><button>دنبال کردن</button></div>
        <div class="suggest"><span class="avatar green">S</span><div><b>Sara</b><small>@sara</small></div><button>دنبال کردن</button></div>
      </div>
    </aside>
  </main>
  <script src="/app.js"></script>
</body>
</html>
